name: DRI source connectivity probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dri-source-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check approved sources without secrets
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          import urllib.error
          urls=[
            'https://www.consilium.europa.eu/en/press/press-releases/2026/11/16/ukraine-eu-lists-113-individuals-and-entities-to-further-restrict-russia-s-ability-to-finance-its-war-of-aggression/',
            'https://www.consilium.europa.eu/en/meetings/fac/2026/11/16/',
            'https://www.eia.gov/outlooks/steo/report/energysecurity/article.php',
            'https://www.ecb.europa.eu/home/html/index.en.html',
            'https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=OJ:L_202602574',
            'https://r.jina.ai/https://www.consilium.europa.eu/en/press/press-releases/2026/11/16/ukraine-eu-lists-113-individuals-and-entities-to-further-restrict-russia-s-ability-to-finance-its-war-of-aggression/',
            'https://commons.wikimedia.org/w/api.php?action=query&titles=File:EU_flags.jpg&format=json',
          ]
          for url in urls:
            try:
              r=urlopen(Request(url, headers={'User-Agent':'Mozilla/5.0'}),timeout=12)
              data=r.read(200)
              print('RESULT',r.status,r.headers.get('Content-Type',''),repr(data[:100]),url,flush=True)
            except Exception as e:
              print('RESULT ERROR',type(e).__name__,str(e)[:120],url,flush=True)
          PY
