name: DRI – verified research to Buffer drafts
on:
  push:
    branches: [main]
    paths: ['dri/**', '.github/workflows/dri-editorial.yml']
  pull_request:
    paths: ['dri/**', '.github/workflows/dri-editorial.yml']
  workflow_dispatch:
    inputs:
      operation:
        description: 'audit only reads Buffer; deliver requires a verified edition'
        type: choice
        options: [audit, deliver]
        default: audit
      incoming_file:
        description: 'Optional dri/incoming/YYYY-MM-DD.json; default today in Copenhagen'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: dri-buffer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r dri/requirements.txt
      - run: python -m unittest discover -s dri/tests -v
  draft:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r dri/requirements.txt
      - name: Select operation without interpolating input into shell
        id: operation
        env:
          EVENT_NAME: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "mode=${OPERATION:-audit}" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$AFTER" -- dri/incoming/ | grep -Eq '^dri/incoming/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$'; then
            echo 'mode=deliver' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=audit' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify sources and create only a draft, or audit existing receipts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          OPERATION: ${{ steps.operation.outputs.mode }}
          INPUT_FILE: ${{ inputs.incoming_file }}
        run: python dri/pipeline.py "$OPERATION" --file "$INPUT_FILE"
      - name: Retain verification, receipts and audit even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dri-editorial-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dri/out/*.json
            dri/out/*.txt
            dri/state/*
          if-no-files-found: warn
          retention-days: 30
